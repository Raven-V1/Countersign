name: Countersign Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  countersign:
    name: Countersign checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pyyaml python-dotenv bandit detect-secrets ruff pytest

      - name: Verify Bob rules are in sync
        run: python scripts/generate_bob_rules.py --check

      - name: Compute changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Base SHA is zeros/empty — ci will scan all tracked files"
          else
            {
              echo "CS_CHANGED_FILES<<EOF"
              git diff --name-only "$BASE" "${{ github.sha }}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Run Countersign CI gate
        run: python countersign.py ci

      - name: Step summary
        if: always()
        run: |
          echo "### Countersign CI Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**IBM Z approval** runs locally only — Zowe requires a z/OS" \
               "connection that is not available in CI. The Z step is skipped" \
               "here by design; every commit that reaches \`main\` was already" \
               "Z-approved locally before push." >> "$GITHUB_STEP_SUMMARY"

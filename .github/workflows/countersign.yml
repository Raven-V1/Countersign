name: Countersign Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  countersign:
    name: Countersign checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Bob rules are in sync
        run: python scripts/generate_bob_rules.py --check

      - name: Run Countersign check
        run: python countersign.py check

      - name: Gate summary on failure
        if: failure()
        run: |
          echo "Countersign gate failed. CI ran the same checks as the local pre-commit hook. Reproduce locally with: python countersign.py check"

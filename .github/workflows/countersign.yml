name: Countersign Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  countersign:
    name: Countersign checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Bob rules are in sync
        id: rules_sync
        run: python scripts/generate_bob_rules.py --check
        continue-on-error: true

      - name: Rules out of sync (failure details)
        if: steps.rules_sync.outcome == 'failure'
        run: |
          echo "::error::Bob rules are out of sync. Run: python scripts/generate_bob_rules.py"
          exit 1

      - name: Run Countersign check
        id: countersign_check
        run: python countersign.py check
        continue-on-error: true

      - name: Countersign check failed (failure details)
        if: steps.countersign_check.outcome == 'failure'
        run: |
          echo "::error::Countersign gate failed. CI ran the same checks as the local pre-commit hook. Reproduce locally with: python countersign.py check"
          exit 1
